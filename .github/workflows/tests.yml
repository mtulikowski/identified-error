name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        symfony: ['6.4.*', '7.*']
        minimum: [false, true]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-minimum-${{ matrix.minimum }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-minimum-${{ matrix.minimum }}-

      - run: composer validate --no-check-publish

      - run: >-
          composer update --no-interaction --prefer-dist
          --with symfony/framework-bundle:${{ matrix.symfony }}
          --with symfony/twig-bundle:${{ matrix.symfony }}
          --with symfony/config:${{ matrix.symfony }}
          --with symfony/dependency-injection:${{ matrix.symfony }}
          ${{ matrix.minimum && '--prefer-lowest --prefer-stable' || '' }}

      - run: composer test
